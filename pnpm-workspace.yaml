# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here.
allowBuilds:
  # A transitive dependency of the build toolchain (tsdown/tsx). Its install
  # script selects the platform esbuild binary used while preparing this git
  # package; the built plugin does not load esbuild at runtime.
  esbuild: true
  # node-pty allocates the terminal Code mode's column attaches to. It ships
  # prebuilt binaries for the common platforms and its install script only
  # selects (or, failing that, compiles) one — there is no terminal without
  # it, so this build is the point of the dependency rather than an incidental
  # extra. The harness itself carries the same package for the same reason
  # (packages/subprocess/subprocess-local).
  node-pty: true

# Every harness package is pinned to one release this plugin chooses
# deliberately, so pnpm's release-age gate has nothing left to protect and its
# generated per-package exclusion list would only churn on every bump. The same
# gate would also block `@omdsh-plugins/omdsh-basemode` for a day after each
# afternoon's publish, which is why the age is zero rather than an exclude list.
minimumReleaseAge: 0

# A git-hosted install runs `pnpm install` in an isolated store directory
# to feed `prepare`. autoInstallPeers would then try to fetch every harness
# peer of every harness package — including `@deepseek-ai/dsh-tools@^0.1.2`,
# which has no matching registry release (latest is a prerelease). The
# profile already installs with this off; the plugin's own tree must too,
# because no setting in the profile reaches that isolated install.
autoInstallPeers: false
